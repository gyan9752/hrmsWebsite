stages:
  - deploy

variables:
  SSH_USER: "girjeshwhats"
  SERVER_IP: "66.116.244.42"
  SSH_PORT: "22"
  APP_DIR: "/home/girjeshwhats/scriza/hrms/website/hrms_website"
  PM2_APP_NAME: "hrvico-website"
  PORT: "5184"

deploy:
  stage: deploy
  image: alpine:latest

  before_script:
    - apk add --no-cache openssh-client git
    - mkdir -p ~/.ssh
    - echo "$SSH_PRIVATE_KEY" | base64 -d > ~/.ssh/id_rsa
    - chmod 600 ~/.ssh/id_rsa
    - touch ~/.ssh/known_hosts
    - ssh-keyscan -p "$SSH_PORT" -H "$SERVER_IP" >> ~/.ssh/known_hosts 2>/dev/null || true

  script:
    - |
      REPO_AUTH_URL="https://gitlab-ci-token:${CI_JOB_TOKEN}@gitlab.com/hrms-frontend2/hrms_website.git"
      if [ -n "$GITLAB_TOKEN" ] && [ -n "$GITLAB_USERNAME" ]; then
        REPO_AUTH_URL="https://${GITLAB_USERNAME}:${GITLAB_TOKEN}@gitlab.com/hrms-frontend2/hrms_website.git"
      fi

      ssh -p "$SSH_PORT" -i ~/.ssh/id_rsa "$SSH_USER@$SERVER_IP" \
        "REPO_AUTH_URL='$REPO_AUTH_URL' bash -s" << 'EOF'
        set -e
        export PATH=$PATH:/usr/local/bin:/usr/bin:~/.nvm/versions/node/$(ls ~/.nvm/versions/node 2>/dev/null | tail -n 1)/bin
        APP_DIR="/home/girjeshwhats/scriza/hrms/website/hrms_website"
        PM2_APP_NAME="hrvico-website"
        PORT="5184"

        echo "======================================"
        echo "Updating code in $APP_DIR..."
        echo "======================================"
        if [ -d "$APP_DIR/.git" ]; then
          cd "$APP_DIR"
          git remote set-url origin "$REPO_AUTH_URL"
          git fetch origin main
          git reset --hard origin/main
          git remote set-url origin "https://gitlab.com/hrms-frontend2/hrms_website.git" || true
        else
          rm -rf "$APP_DIR"
          git clone "$REPO_AUTH_URL" "$APP_DIR"
          cd "$APP_DIR"
          git remote set-url origin "https://gitlab.com/hrms-frontend2/hrms_website.git" || true
        fi

        echo "--------------------------------------"
        echo "Node and NPM versions:"
        node -v
        npm -v
        echo "--------------------------------------"

        echo "Installing dependencies..."
        npm install --legacy-peer-deps

        echo "Building Next.js application..."
        rm -rf .next
        npm run build

        echo "Starting / Reloading PM2 application..."
        if pm2 describe "$PM2_APP_NAME" > /dev/null 2>&1; then
          pm2 restart "$PM2_APP_NAME" --update-env
        else
          pm2 start npm --name "$PM2_APP_NAME" -- start -- -p "$PORT"
        fi
        pm2 save || true

        echo "Checking PM2 process status..."
        pm2 status

        echo "Verifying local service on port $PORT..."
        sleep 5
        curl -f http://127.0.0.1:$PORT > /dev/null || exit 1
        echo "======================================"
        echo "Next.js application is healthy on port $PORT!"
        echo "======================================"
      EOF

  rules:
    - if: '$CI_COMMIT_BRANCH == "main"'