stages:
  - deploy

variables:
  SSH_USER: "girjeshwhats"
  SERVER_IP: "66.116.244.42"
  SSH_PORT: "22"
  APP_DIR: "/home/girjeshwhats/scriza/hrms/website/hrms_website"

deploy:
  stage: deploy
  image: alpine:latest

  before_script:
    - apk add --no-cache openssh-client git
    - mkdir -p ~/.ssh
    - echo "$SSH_PRIVATE_KEY" | base64 -d > ~/.ssh/id_rsa
    - chmod 600 ~/.ssh/id_rsa
    - ssh-keyscan -H $SERVER_IP >> ~/.ssh/known_hosts

  script:
    - |
      ssh $SSH_USER@$SERVER_IP "
        echo '=== SUDO PERMISSIONS ==='
        sudo -n -l 2>/dev/null || echo 'No passwordless sudo'
        echo '=== LISTENING PORTS ==='
        ss -tlpn 2>/dev/null || netstat -tlpn 2>/dev/null || lsof -i -P -n | grep LISTEN || true
        echo '=== NGINX CONF FILENAMES ==='
        grep -rn 'hrvico.com' /etc/nginx/ 2>/dev/null || true
      "

  rules:
    - if: '$CI_COMMIT_BRANCH == "main"'