stages:
  - deploy

variables:
  SSH_USER: "girjeshwhats"
  SERVER_IP: "66.116.244.42"
  SSH_PORT: "22"
  APP_DIR: "/home/girjeshwhats/scriza/hrms/website/hrms_website"

deploy:
  stage: deploy
  image: alpine:latest

  before_script:
    - apk add --no-cache openssh-client git
    - mkdir -p ~/.ssh
    - echo "$SSH_PRIVATE_KEY" | base64 -d > ~/.ssh/id_rsa
    - chmod 600 ~/.ssh/id_rsa
    - ssh-keyscan -H $SERVER_IP >> ~/.ssh/known_hosts

  script:
    - |
      ssh $SSH_USER@$SERVER_IP "
        pm2 describe hrms-frontend 2>/dev/null || true
        pm2 describe 62 2>/dev/null || true
      "

  rules:
    - if: '$CI_COMMIT_BRANCH == "main"'