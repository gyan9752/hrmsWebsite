stages:
  - deploy

variables:
  SSH_USER: "girjeshwhats"
  SERVER_IP: "66.116.244.42"
  SSH_PORT: "22"
  APP_DIR: "/home/girjeshwhats/scriza/hrms/website/hrms_website"

deploy:
  stage: deploy
  image: alpine:latest

  before_script:
    - apk add --no-cache openssh-client git
    - mkdir -p ~/.ssh
    - echo "$SSH_PRIVATE_KEY" | base64 -d > ~/.ssh/id_rsa
    - chmod 600 ~/.ssh/id_rsa
    - ssh-keyscan -H $SERVER_IP >> ~/.ssh/known_hosts

  script:
    - |
      ssh $SSH_USER@$SERVER_IP "
        echo '=== WHOAMI / PWD ==='
        whoami; pwd
        echo '=== NODE / NPM / PM2 ==='
        export PATH=\$PATH:/usr/local/bin:/usr/bin:~/.nvm/versions/node/\$(ls ~/.nvm/versions/node 2>/dev/null | tail -n 1)/bin
        which node || true
        node -v || true
        which npm || true
        npm -v || true
        which pm2 || true
        pm2 list || true
        echo '=== NGINX CONFIGS ==='
        cat /etc/nginx/sites-enabled/* 2>/dev/null || cat /etc/nginx/conf.d/* 2>/dev/null || true
        echo '=== APP DIR LISTING ==='
        ls -la $APP_DIR || true
      "

  rules:
    - if: '$CI_COMMIT_BRANCH == "main"'